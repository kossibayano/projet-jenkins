---
- name: Déploiement de l'application WAR sur les serveurs Tomcat
  hosts: webservers
  gather_facts: no
  tasks:
    - name: Transfert du fichier WAR vers le répertoire webapps de Tomcat
      ansible.builtin.copy:
        src: jenkins-demo-app-1.0.0.war
        dest: /opt/tomcat/webapps/jenkins-demo-app-1.0.0.war
        owner: tomcat
        group: tomcat
        mode: '0644'

    - name: Redémarrage du service Tomcat (optionnel si auto-deploy actif)
      ansible.builtin.systemd:
        name: tomcat
        state: restarted
      become: yes
